name: Build GoreKernel for vayu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Cleanup
        run: rm -rf ${{ github.workspace }}/build_output*

      - name: Update system
        run: |
          sudo apt-get update && sudo apt-get upgrade -y
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc

      
      - name: Install required packages
        run: sudo apt-get install -y $(cat tools/build/packages.sh)
      
        
      - name: Setup Swap
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon --priority 10 /swapfile

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: adamspaini/kernel_vayu_sm8150_
          ref: fiveteen
          path: kernel

      - name: Clone ZyC Clang toolchain
        run: git clone --depth=1 https://github.com/ZyCromerZ/Clang clang

      - name: Clone AnyKernel3
        run: git clone --depth=1 -b master https://github.com/GXC2356/AnyKernel3.git

      - name: Build kernel and save logs
        continue-on-error: true
        run: |
          export KERNEL_DIR=$GITHUB_WORKSPACE/kernel
          export CLANG_PATH=$GITHUB_WORKSPACE/clang
          export PATH=$CLANG_PATH/bin:$PATH
          export KBUILD_BUILD_HOST=@adams4d13
          export KBUILD_BUILD_USER=arch-linux
          export ARCH=arm64
          export SUBARCH=arm64
          cd $KERNEL_DIR

          make O=out ARCH=arm64 vayu_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              STRIP=llvm-strip \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              HOSTAR=llvm-ar \
              HOSTLD=ld.lld \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
              |& tee ../build.log

      - name: Check if kernel image exists
        run: |
          if [ ! -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Build failed: kernel image not found."
            exit 1
          fi

      - name: Move kernel to AnyKernel3
        run: cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

      - name: Package flashable ZIP
        run: |
          cd AnyKernel3
          ZIP_NAME="GoreKernel_vayu_nonksu_$(date +'%Y%m%d_%H%M').zip"
          zip -r9 "$ZIP_NAME" * -x .git README.md
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload artifacts (ZIP + build log)
        uses: actions/upload-artifact@v4
        with:
          name: GoreKernel_vayu_nonksu
          path: |
            AnyKernel3/${{ env.ZIP_NAME }}
            build.log

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vayu-${{ github.run_id }}
          name: GoreKernel vayu - ${{ github.run_id }}
          body: |
            Compilado automáticamente con GitHub Actions.
            - Defconfig: `vayu_defconfig`
            - Toolchain: ZyC Clang
            - Android 15 ready
          files: |
            AnyKernel3/${{ env.ZIP_NAME }}
            build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
