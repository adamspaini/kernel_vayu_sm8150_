name: Build GoreKernel for vayu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Cleanup
        run: rm -rf ${{ github.workspace }}/build_output*

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get remove -y gcc-multilib
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc ccache lld llvm device-tree-compiler nano ca-certificates curl git libc6-dev openssl python3 python3-pip python-is-python3 ssh wget zip zstd make clang software-properties-common libarchive-tools gcc-13-aarch64-linux-gnu g++-13-aarch64-linux-gnu gcc-13-arm-linux-gnueabi g++-13-arm-linux-gnueabi libffi-dev libreadline-dev libbz2-dev libsqlite3-dev pigz cpio neofetch
          sudo apt-get upgrade -y
          neofetch

      - name: Setup Swap
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon --priority 10 /swapfile

      - name: Restore ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.ref }}
            ccache-

      - name: Configure ccache
        run: |
          export USE_CCACHE=1
          ccache -M 10G

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: adamspaini/kernel_vayu_sm8150_
          ref: fiveteen
          path: kernel

      - name: Clone ZyC Clang toolchain
        run: git clone --depth=1 https://github.com/ZyCromerZ/Clang clang

      - name: Clone AnyKernel3
        run: git clone --depth=1 -b master https://github.com/GXC2356/AnyKernel3.git

      - name: Build kernel and save logs
        continue-on-error: true
        run: |
          export KERNEL_DIR=$GITHUB_WORKSPACE/kernel
          export CLANG_PATH=$GITHUB_WORKSPACE/clang
          export PATH=$CLANG_PATH/bin:$PATH
          export KBUILD_BUILD_HOST=@adams4d13
          export KBUILD_BUILD_USER=arch-linux
          export ARCH=arm64
          export SUBARCH=arm64
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          cd $KERNEL_DIR

          make O=out ARCH=arm64 vayu_defconfig
          make -j$(nproc) -l$(nproc) O=out ARCH=arm64 \
              CC="ccache clang" \
              SUBARCH=arm64 \
              DTC_EXT=dtc \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              STRIP=llvm-strip \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              HOSTCC=clang \
              HOSTCXX=clang++ \
              HOSTAR=llvm-ar \
              HOSTLD=ld.lld \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
              2>&1 | tee ../build.log

          # Explicitly build required images
          make O=out ARCH=arm64 Image.gz-dtb dtbo.img \
              CC="ccache clang" \
              LD=ld.lld \
              2>&1 | tee -a ../build.log

      - name: Save ccache cache
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref }}-${{ github.run_id }}

      - name: Check build artifacts
        run: |
          kernel_dir="${PWD}/kernel"
          objdir="${kernel_dir}/out"
          
          echo "Checking build artifacts in: ${objdir}/arch/arm64/boot/"
          ls -la "${objdir}/arch/arm64/boot/" || true
          
          # Check for kernel image
          if [[ -f "${objdir}/arch/arm64/boot/Image.gz-dtb" ]]; then
            echo "Found Image.gz-dtb"
          elif [[ -f "${objdir}/arch/arm64/boot/Image" ]]; then
            echo "Found Image (will create Image.gz-dtb later)"
          else
            echo "ERROR: No kernel image found!"
            exit 1
          fi

          # Check for DTBO (optional)
          if [[ -f "${objdir}/arch/arm64/boot/dtbo.img" ]]; then
            echo "Found dtbo.img"
          else
            echo "WARNING: dtbo.img not found (may be normal for some kernels)"
          fi

      - name: Prepare AnyKernel3 files
        run: |
          kernel_dir="${PWD}/kernel"
          objdir="${kernel_dir}/out"
          
          # Handle kernel image
          if [[ -f "${objdir}/arch/arm64/boot/Image.gz-dtb" ]]; then
            cp "${objdir}/arch/arm64/boot/Image.gz-dtb" AnyKernel3/
          elif [[ -f "${objdir}/arch/arm64/boot/Image" ]]; then
            echo "Creating Image.gz-dtb from Image"
            gzip -nc9 "${objdir}/arch/arm64/boot/Image" > AnyKernel3/Image.gz
            dtb_path=$(find "${objdir}/arch/arm64/boot/dts" -name '*.dtb' | head -1)
            if [[ -f "$dtb_path" ]]; then
              cat AnyKernel3/Image.gz "$dtb_path" > AnyKernel3/Image.gz-dtb
            else
              mv AnyKernel3/Image.gz AnyKernel3/Image.gz-dtb
            fi
          fi

          # Handle DTBO if exists
          if [[ -f "${objdir}/arch/arm64/boot/dtbo.img" ]]; then
            cp "${objdir}/arch/arm64/boot/dtbo.img" AnyKernel3/
          fi

      - name: Package flashable ZIP
        run: |
          cd AnyKernel3
          ZIP_NAME="GoreKernel_vayu_nonksu_$(date +'%Y%m%d_%H%M').zip"
          zip -r9 "$ZIP_NAME" * -x .git README.md
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload artifacts (ZIP + build log)
        uses: actions/upload-artifact@v4
        with:
          name: GoreKernel_vayu_nonksu
          path: |
            AnyKernel3/${{ env.ZIP_NAME }}
            build.log

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vayu-${{ github.run_id }}
          name: GoreKernel vayu - ${{ github.run_id }}
          body: |
            Compilado automáticamente con GitHub Actions.
            - Defconfig: `vayu_defconfig`
            - Toolchain: ZyC Clang
            - Android 15 ready
          files: |
            AnyKernel3/${{ env.ZIP_NAME }}
            build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup swap
        if: always()
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile || true
