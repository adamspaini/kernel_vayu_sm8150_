name: Build GoreKernel for vayu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Cleanup workspace
        run: rm -rf ${{ github.workspace }}/build_output*

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc ccache lld llvm device-tree-compiler git wget zip python3 make clang gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Swap (16GB)
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Configure ccache
        run: |
          export USE_CCACHE=1
          ccache -M 10G

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: adamspaini/kernel_vayu_sm8150_
          ref: fiveteen
          path: kernel

      - name: Clone toolchains
        run: |
          git clone --depth=1 https://github.com/ZyCromerZ/Clang clang
          git clone --depth=1 -b master https://github.com/GXC2356/AnyKernel3.git

      - name: Build kernel
        run: |
          export KERNEL_DIR=$GITHUB_WORKSPACE/kernel
          export CLANG_PATH=$GITHUB_WORKSPACE/clang
          export PATH=$CLANG_PATH/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          cd $KERNEL_DIR
          
          # Build configuration
          make O=out ARCH=arm64 vayu_defconfig
          
          # Build kernel and device trees (CORREGIDO: dtbo.img en lugar de dibo.img)
          make -j$(nproc) O=out ARCH=arm64 \
              CC="ccache clang" \
              CROSS_COMPILE=aarch64-linux-gnu- \
              LD=ld.lld \
              LLVM=1 \
              LLVM_IAS=1 \
              Image dtbo.img dtbs 2>&1 | tee build.log

          # Verify outputs
          ls -la out/arch/arm64/boot/

      - name: Prepare AnyKernel3 package
        run: |
          KERNEL_DIR=$GITHUB_WORKSPACE/kernel
          ANY_KERNEL_DIR=$GITHUB_WORKSPACE/AnyKernel3
          
          # Copy required files
          cp $KERNEL_DIR/out/arch/arm64/boot/Image $ANY_KERNEL_DIR/
          cp $KERNEL_DIR/out/arch/arm64/boot/dtbo.img $ANY_KERNEL_DIR/
          
          # Combine dtbs into single dtb.img
          find $KERNEL_DIR/out/arch/arm64/boot/dts/vendor -name '*.dtb' -exec cat {} + > $ANY_KERNEL_DIR/dtb.img

          # Create ZIP
          cd $ANY_KERNEL_DIR
          zip -r9 GoreKernel-vayu-$(date +"%Y%m%d-%H%M").zip * -x .git README.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoreKernel-Package
          path: AnyKernel3/*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: AnyKernel3/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile || true
