name: Build GoreKernel for vayu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup
        run: rm -rf ${{ github.workspace }}/build_output*

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev \
            libelf-dev bc ccache lld llvm device-tree-compiler \
            git curl zip zstd make clang \
            gcc-13-aarch64-linux-gnu g++-13-aarch64-linux-gnu \
            gcc-13-arm-linux-gnueabi g++-13-arm-linux-gnueabi \
            python3 python3-pip python-is-python3 ca-certificates \
            libarchive-tools neofetch python2

      - name: Setup swap
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon --priority 10 /swapfile

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.ref }}
            ccache-

      - name: Configure ccache
        run: |
          export USE_CCACHE=1
          ccache -M 10G

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: adamspaini/kernel_vayu_sm8150_
          ref: fiveteen
          path: kernel

      - name: Clone ZyC Clang toolchain
        run: git clone --depth=1 https://github.com/ZyCromerZ/Clang clang

      - name: Clone AnyKernel3
        run: git clone --depth=1 -b master https://github.com/GXC2356/AnyKernel3.git

      - name: Build kernel and images
        run: |
          set -x  # Enable debugging
          export KERNEL_DIR=$GITHUB_WORKSPACE/kernel
          export CLANG_PATH=$GITHUB_WORKSPACE/clang
          export PATH=$CLANG_PATH/bin:$PATH
          export KBUILD_BUILD_HOST=@adams4d13
          export KBUILD_BUILD_USER=arch-linux
          export ARCH=arm64
          export SUBARCH=arm64
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          cd $KERNEL_DIR

          # Build kernel
          make O=out ARCH=arm64 vayu_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
            LD=ld.lld LLVM=1 LLVM_IAS=1

          # Generate dtb.img
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cat {} + > out/arch/arm64/boot/dtb.img || exit 1

          # Prepare dtbo files
          mkdir -p out/dtbo
          find out/arch/arm64/boot/dts -name "*.dts" | while read dts; do
            name=$(basename "$dts" .dts)
            $KERNEL_DIR/scripts/dtc/dtc -I dts -O dtb -o out/dtbo/$name.dtbo "$dts" || exit 1
          done

          # Download mkdtimg tools
          curl -sLO https://android.googlesource.com/platform/system/libufdt/+archive/refs/heads/master.tar.gz
          mkdir -p tools/libufdt
          tar xzf master.tar.gz -C tools/libufdt
          rm master.tar.gz

          # Create dtbo.img.cfg
          mkdir -p tools/libufdt
          echo "# dtbo.img layout" > tools/libufdt/dtbo.img.cfg
          for f in out/dtbo/*.dtbo; do
            echo "[${f##*/}]" >> tools/libufdt/dtbo.img.cfg
            echo "filename = $f" >> tools/libufdt/dtbo.img.cfg
          done

          # Build dtbo.img using python script
          python2 tools/libufdt/utils/src/mkdtboimg.py create \
            out/arch/arm64/boot/dtbo.img \
            --page_size=4096 \
            out/dtbo/*.dtbo || exit 1

      - name: Save ccache
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref }}-${{ github.run_id }}

      - name: Prepare AnyKernel3 files
        run: |
          cd kernel
          outdir=out/arch/arm64/boot
          cp $outdir/Image ../AnyKernel3/ || exit 1
          cp $outdir/dtb.img ../AnyKernel3/ || exit 1
          cp $outdir/dtbo.img ../AnyKernel3/ || exit 1

      - name: Package flashable ZIP
        run: |
          cd AnyKernel3
          ZIP_NAME="GoreKernel_vayu_$(date +'%Y%m%d_%H%M').zip"
          zip -r9 "$ZIP_NAME" * -x .git README.md || exit 1
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload artifacts (ZIP + build log)
        uses: actions/upload-artifact@v4
        with:
          name: GoreKernel_vayu
          path: |
            AnyKernel3/${{ env.ZIP_NAME }}
            kernel/build.log

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vayu-${{ github.run_id }}
          name: GoreKernel vayu - ${{ github.run_id }}
          body: |
            Kernel compilado automáticamente para vayu.
            - Defconfig: `vayu_defconfig`
            - Toolchain: ZyC Clang
            - Archivos incluidos: `Image`, `dtbo.img`, `dtb.img`
          files: |
            AnyKernel3/${{ env.ZIP_NAME }}
            kernel/build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup swap
        if: always()
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile || true
