name: Build GoreKernel for vayu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get instal
          apt update -y && apt upgrade -y && apt install nano bc bison ca-certificates curl flex gcc git libc6-dev libssl-dev openssl python-is-python3 ssh wget zip zstd sudo make clang gcc-arm-linux-gnueabi software-properties-common build-essential libarchive-tools gcc-aarch64-linux-gnu -y && apt install build-essential -y && apt install libssl-dev libffi-dev libncurses5-dev zlib1g zlib1g-dev libreadline-dev libbz2-dev libsqlite3-dev make gcc -y && apt install pigz -y && apt install python2 -y && apt install python3 -y && apt install cpio -y && apt install lld -y && sudo apt-get install gcc-aarch64-linux-gnu && sudo apt-get install g++-aarch64-linux-gnu && apt install neofetch -y && neofetch
          sudo apt install device-tree-compiler
          sudo apt update -y && sudo apt upgrade -y && sudo apt install nano bc bison ca-certificates curl flex gcc git libc6-dev libssl-dev openssl python-is-python3 ssh wget zip zstd sudo make clang gcc-arm-linux-gnueabi software-properties-common build-essential libarchive-tools gcc-aarch64-linux-gnu -y && sudo apt install build-essential -y && sudo apt install libssl-dev libffi-dev libncurses5-dev zlib1g zlib1g-dev libreadline-dev libbz2-dev libsqlite3-dev make gcc -y && sudo apt install pigz -y && sudo apt install python2 -y && sudo apt install python3 -y && sudo apt install cpio -y && sudo apt install lld -y
          sudo apt update && sudo -H apt-get install bc python2 ccache binutils-aarch64-linux-gnu cpio
          
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: adamspaini/kernel_vayu_sm8150_
          ref: fifteen
          path: kernel

      - name: Clone ZyC Clang toolchain
        run: git clone --depth=1 https://github.com/ZyCromerZ/Clang clang

      - name: Clone AnyKernel3
        run: git clone --depth=1 -b master https://github.com/GXC2356/AnyKernel3.git

      - name: Build kernel and save logs
        run: |
          set -e

          export KERNEL_DIR=$GITHUB_WORKSPACE/kernel
          export CLANG_PATH=$GITHUB_WORKSPACE/clang
          export PATH=$CLANG_PATH/bin:$PATH
          export KBUILD_BUILD_HOST=@adams4d13
          export KBUILD_BUILD_USER=arch-linux
          export ARCH=arm64
          export SUBARCH=arm64
          cd $KERNEL_DIR

          make O=out ARCH=arm64 vayu_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              STRIP=llvm-strip \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              HOSTAR=llvm-ar \
              HOSTLD=ld.lld \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
              |& tee ../build.log

      - name: Move kernel to AnyKernel3
        run: cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

      - name: Package flashable ZIP
        run: |
          cd AnyKernel3
          zip -r9 GoreKernel_vayu_nonksu.zip * -x .git README.md

      - name: Upload artifacts (ZIP + build log)
        uses: actions/upload-artifact@v4
        with:
          name: GoreKernel_vayu_nonksu
          path: |
            AnyKernel3/GoreKernel_vayu_nonksu.zip
            build.log

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vayu-${{ github.run_id }}
          name: GoreKernel vayu - ${{ github.run_id }}
          body: |
            Compilado automáticamente con GitHub Actions.
            - Defconfig: `vayu_defconfig`
            - Toolchain: ZyC Clang
            - Android 15 ready
          files: |
            AnyKernel3/GoreKernel_vayu_nonksu.zip
            build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
